name: codyssey-proxy
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    volumes:
      - /opt/codyssey-aichat/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/codyssey-caddy/data:/data
      - /var/lib/codyssey-caddy/config:/config
    tmpfs: ["/tmp:size=32m"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
