{% extends "base.html" %}

{% block title %}로그인 · {{ project_name }}{% endblock %}

{% block content %}
  <main class="page-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="page-title">로그인</h1>
      <p class="lead">가입한 아이디와 비밀번호를 입력해 주세요.</p>

      {% if registered %}
        <p class="form-message form-message-success" role="status">
          회원가입이 완료되었습니다. 새 계정으로 로그인해 주세요.
        </p>
      {% endif %}
      {% if error %}
        <p class="form-message form-message-error" role="alert">{{ error }}</p>
      {% endif %}

      <form class="auth-form" method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

        <div class="form-field">
          <label for="username">아이디</label>
          <input
            id="username"
            name="username"
            type="text"
            value="{{ username }}"
            minlength="5"
            maxlength="20"
            pattern="[a-z0-9_-]+"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="form-field">
          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            maxlength="16"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="button button-primary button-full" type="submit">
          로그인
        </button>
      </form>

      <p class="auth-switch">계정이 없나요? <a href="/signup">회원가입</a></p>
    </section>
  </main>
{% endblock %}
