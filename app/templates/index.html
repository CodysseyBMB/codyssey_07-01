{% extends "base.html" %}

{% block title %}{{ project_name }} · 프로젝트 준비 완료{% endblock %}

{% block content %}
  <main class="page-shell">
    <section class="status-card" aria-labelledby="page-title">
      <span class="status-badge">Scaffolding ready</span>
      <h1 id="page-title">{{ project_name }}</h1>
      <p class="lead">
        FastAPI와 Jinja2 기본 구성이 완료되었습니다. 이후 인증, 채팅,
        AI API 기능을 이 구조 위에 추가합니다.
      </p>

      <dl class="endpoint-list">
        <div>
          <dt>서비스 상태</dt>
          <dd><a href="/health"><code>GET /health</code></a></dd>
        </div>
        <div>
          <dt>API 문서</dt>
          <dd><a href="/docs"><code>GET /docs</code></a></dd>
        </div>
      </dl>
    </section>
  </main>
{% endblock %}
